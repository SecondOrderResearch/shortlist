name: Deploy Backend to Oracle Cloud

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/deploy_shortlist_oracle.sh'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud VM via SSH
        env:
          OCI_VM_IP: ${{ secrets.OCI_VM_IP }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          set -e
          echo "$OCI_SSH_KEY" > /tmp/oci_key
          chmod 600 /tmp/oci_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/oci_key"
          ssh $SSH_OPTS ubuntu@$OCI_VM_IP "bash -s" < scripts/deploy_shortlist_oracle.sh